name: slr-toolkit

# Deploys the app together with PostgreSQL and Qdrant.
# Authentication (Keycloak) and the embedding/classifier services are hosted
# separately and referenced via environment variables.
#
# Copy .env.docker.example to .env (or .env.docker and run with
# `docker compose --env-file .env.docker up -d --build`).

x-database-url: &database-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-slr-toolkit}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # No host port publish: a reverse proxy (e.g. Coolify's Traefik) reaches
    # the container on the internal network. For a proxy-less deployment, add
    # a docker-compose.override.yml with a `ports: ["3000:3000"]` mapping.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      PRISMA_FIELD_ENCRYPTION_KEY: ${PRISMA_FIELD_ENCRYPTION_KEY:?PRISMA_FIELD_ENCRYPTION_KEY is required}
      QDRANT_URL: http://qdrant
      QDRANT_PORT: "6333"
      QDRANT_SECRET: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      # Auth (Keycloak is hosted separately)
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required (public URL of this app, e.g. https://slr.example.com)}
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_ID: ${KEYCLOAK_ID:?KEYCLOAK_ID is required}
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET:?KEYCLOAK_SECRET is required}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required}
      # External embedding + classifier services
      DEFAULT_VECTORPROVIDER_URL: ${DEFAULT_VECTORPROVIDER_URL:?DEFAULT_VECTORPROVIDER_URL is required}
      DEFAULT_VECTORPROVIDER_SECRET: ${DEFAULT_VECTORPROVIDER_SECRET:?DEFAULT_VECTORPROVIDER_SECRET is required}
      DEFAULT_VECTORPROVIDER_VECTOR_SIZE: ${DEFAULT_VECTORPROVIDER_VECTOR_SIZE:?DEFAULT_VECTORPROVIDER_VECTOR_SIZE is required}
      DEFAULT_CLASSIFIER_URL: ${DEFAULT_CLASSIFIER_URL:?DEFAULT_CLASSIFIER_URL is required}
      DEFAULT_CLASSIFIER_USERNAME: ${DEFAULT_CLASSIFIER_USERNAME:-}
      DEFAULT_CLASSIFIER_PASSWORD: ${DEFAULT_CLASSIFIER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs `prisma migrate deploy` once before the app starts. Uses the `deps`
  # build stage, which contains the Prisma CLI (the runtime image does not).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-slr-toolkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    # Pinned to the same major.minor as @qdrant/js-client-rest in package-lock.json
    image: qdrant/qdrant:v1.16.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The qdrant image ships neither curl nor wget; use bash's /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  qdrant-data:
